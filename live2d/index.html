
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inochi Studio - Live2D Editor</title>

  <link rel="stylesheet" href="../shared/home.css">
  <link rel="stylesheet" href="./styles/editor.css">
</head>

<body class="live2d-editor">

  <!-- ヘッダー -->
  <header class="editor-header">

    <div class="header-left">
      <a href="../index.html" class="back-button">← HOME</a>
      <div class="editor-logo">INOCHI STUDIO</div>
      <div class="editor-mode">LIVE2D</div>
    </div>

    <div class="header-center">
      <span id="projectName">Untitled Model</span>
    </div>

    <div class="header-right">
      <button id="undoButton">↶</button>
      <button id="redoButton">↷</button>
      <button id="saveButton">保存</button>
      <button id="exportButton">書き出し</button>
    </div>

  </header>

  <!-- メインメニュー -->
  <nav class="editor-menu">
    <button>ファイル</button>
    <button>編集</button>
    <button>表示</button>
    <button>モデル</button>
    <button>メッシュ</button>
    <button>アニメーション</button>
    <button>ヘルプ</button>
  </nav>

  <!-- エディター全体 -->
  <main class="editor-layout">

    <!-- 左パネル -->
    <aside class="left-panel">

      <section class="panel-section">

        <div class="panel-title">ツール</div>

        <div class="tool-grid">

          <button class="tool-button active" data-tool="select">
            ↖<span>選択</span>
          </button>

          <button class="tool-button" data-tool="move">
            ✥<span>移動</span>
          </button>

          <button class="tool-button" data-tool="mesh">
            ◇<span>メッシュ</span>
          </button>

          <button class="tool-button" data-tool="deform">
            ▧<span>変形</span>
          </button>

          <button class="tool-button" data-tool="rotate">
            ⟳<span>回転</span>
          </button>

          <button class="tool-button" data-tool="brush">
            ✎<span>ブラシ</span>
          </button>

        </div>

      </section>

      <section class="panel-section parts-section">

        <div class="panel-heading">
          <span>パーツ一覧</span>
          <button id="addPartButton">＋</button>
        </div>

        <div id="partsList" class="parts-list">
          <div class="empty-message">
            まだパーツがありません
          </div>
        </div>

        <input
          type="file"
          id="imageFileInput"
          accept="image/*"
          hidden
        >

        <button id="importImageButton" class="wide-button">
          ＋ 画像を読み込む
        </button>

      </section>

    </aside>

    <!-- 中央キャンバス -->
    <section class="canvas-area">

      <div class="canvas-toolbar">

        <span>MODEL VIEW</span>

        <div class="canvas-controls">
          <button id="zoomOutButton">－</button>
          <span id="zoomValue">100%</span>
          <button id="zoomInButton">＋</button>
          <button id="fitCanvasButton">全体表示</button>
        </div>

      </div>

      <div class="canvas-wrapper">

        <canvas id="live2dCanvas"></canvas>

        <div id="canvasEmpty" class="canvas-empty">
          <div class="empty-icon">◇</div>
          <h2>モデルを制作しよう</h2>
          <p>画像を読み込んでLive2D制作を始めよう。</p>
          <button id="canvasImportButton">
            画像を読み込む
          </button>
        </div>

      </div>

      <div class="canvas-status">
        <span id="editorStatus">準備完了</span>
        <span>INOCHI LIVE2D ENGINE</span>
      </div>

    </section>

    <!-- 右パネル -->
    <aside class="right-panel">

      <section class="panel-section">

        <div class="panel-title">プロパティ</div>

        <div id="propertyContent">
          <div class="empty-message">
            パーツを選択してください
          </div>
        </div>

      </section>

      <section class="panel-section">

        <div class="panel-heading">
          <span>パラメータ</span>
          <button id="addParameterButton">＋</button>
        </div>

        <div id="parameterList">
          <div class="empty-message">
            パラメータはまだありません
          </div>
        </div>

      </section>

      <section class="panel-section">

        <div class="panel-heading">
          <span>デフォーマ</span>
          <button id="addDeformerButton">＋</button>
        </div>

        <div id="deformerList">
          <div class="empty-message">
            デフォーマはまだありません
          </div>
        </div>

      </section>

    </aside>

  </main>

  <!-- タイムライン -->
  <section class="timeline-panel">

    <div class="timeline-header">
      <span>タイムライン</span>

      <div>
        <button id="playButton">▶</button>
        <button id="stopButton">■</button>
        <button id="addKeyframeButton">＋ キーフレーム</button>
      </div>
    </div>

    <div class="timeline-content">
      <div class="timeline-empty">
        アニメーション機能は今後実装
      </div>
    </div>

  </section>

  <script type="module" src="./main.js"></script>

</body>
</html>
