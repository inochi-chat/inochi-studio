
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inochi Studio - 3D Editor</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #17152b;
      color: #f8f5ff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #211d39;
      border-bottom: 1px solid #40375e;
    }

    .logo {
      font-weight: bold;
      letter-spacing: 2px;
    }

    header a {
      color: #c9b5ff;
      text-decoration: none;
      font-size: 13px;
    }

    .editor {
      display: grid;
      grid-template-columns: 210px 1fr;
      height: calc(100dvh - 60px);
    }

    .sidebar {
      background: #211d39;
      padding: 15px;
      border-right: 1px solid #40375e;
      overflow-y: auto;
    }

    .sidebar h3 {
      font-size: 13px;
      color: #c9b5ff;
      margin: 12px 0;
    }

    button {
      width: 100%;
      padding: 11px;
      margin-bottom: 7px;
      border: 1px solid #51466f;
      border-radius: 8px;
      background: #30284c;
      color: white;
      cursor: pointer;
    }

    button:active {
      background: #62518d;
    }

    .object-item.selected {
      background: #6854a0;
      border-color: #c9b5ff;
    }

    .viewport {
      position: relative;
      min-width: 0;
      min-height: 0;
      background: #17152b;
    }

    #threeCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .viewport-label {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #aaa0c8;
      font-size: 11px;
      pointer-events: none;
    }

    @media (max-width: 650px) {
      .editor {
        grid-template-columns: 125px 1fr;
      }

      .sidebar {
        padding: 8px;
      }

      .sidebar h3 {
        font-size: 11px;
      }

      button {
        padding: 9px 4px;
        font-size: 11px;
      }

      .logo {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">INOCHI STUDIO / 3D</div>
    <a href="../index.html">← ホーム</a>
  </header>

  <main class="editor">
    <aside class="sidebar">
      <h3>オブジェクト追加</h3>
      <button id="addCube">＋ キューブ</button>
      <button id="addSphere">＋ 球体</button>
      <button id="addCylinder">＋ 円柱</button>

      <h3>編集ツール</h3>
      <button id="moveTool">移動</button>
      <button id="rotateTool">回転</button>
      <button id="scaleTool">拡大・縮小</button>
      <button id="deleteObject">削除</button>

      <h3>オブジェクト一覧</h3>
      <div id="objectList"></div>
    </aside>

    <section class="viewport">
      <div class="viewport-label">3D VIEWPORT</div>
      <canvas id="threeCanvas"></canvas>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
