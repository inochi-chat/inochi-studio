
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17152b">
  <title>Inochi Studio - 3D Editor</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #17152b;
      --panel: #211d39;
      --panel-light: #29233f;
      --panel-hover: #493b70;
      --border: #493f67;
      --accent: #a48be8;
      --accent-light: #c9b5ff;
      --text: #f5f0ff;
      --muted: #aaa0c8;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      min-height: 40px;
      padding: 9px 10px;
      margin: 0 0 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #30284c;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      touch-action: manipulation;
    }

    button:hover {
      background: var(--panel-hover);
      border-color: var(--accent);
    }

    button:active {
      background: #62518d;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent-light);
      outline-offset: 2px;
    }

    header {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-weight: 800;
      letter-spacing: 1.5px;
      font-size: 14px;
    }

    header a {
      color: var(--accent-light);
      text-decoration: none;
      font-size: 13px;
      padding: 9px 12px;
      border-radius: 7px;
    }

    header a:hover {
      background: var(--panel-hover);
    }

    /* メインレイアウト */

    .editor {
      --sidebar-width: 220px;

      display: grid;
      grid-template-columns:
        var(--sidebar-width)
        10px
        minmax(0, 1fr)
        250px;

      grid-template-rows: minmax(0, 1fr);
      height: calc(100dvh - 55px);
      min-height: 0;
      min-width: 0;
    }

    .sidebar {
      min-width: 0;
      min-height: 0;
      padding: 14px 12px;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--panel);
      border-right: 1px solid var(--border);
      scrollbar-width: thin;
      scrollbar-color: #62518d transparent;
    }

    .sidebar h3 {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-light);
      letter-spacing: 0.5px;
      margin: 17px 0 9px;
    }

    .sidebar h3:first-child {
      margin-top: 3px;
    }

    .sidebar > button {
      width: 100%;
    }

    /* 右側プロパティ */

    .properties {
      grid-column: 4;
      grid-row: 1;
      border-right: none;
      border-left: 1px solid var(--border);
    }

    .properties-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      margin-bottom: 12px;
    }

    .properties-header h3 {
      margin: 4px 0;
    }

    #togglePropertiesButton {
      flex: 0 0 auto;
      width: auto;
      min-width: 88px;
      min-height: 38px;
      padding: 6px 10px;
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      background: #493b70;
      border-color: #7964a8;
    }

    .properties.collapsed #propertyPanel {
      display: none;
    }

    /* デスクトップでプロパティを細くする */

    .editor.properties-collapsed {
      grid-template-columns:
        var(--sidebar-width)
        10px
        minmax(0, 1fr)
        48px;
    }

    .properties.collapsed {
      padding: 10px 4px;
      overflow: hidden;
    }

    .properties.collapsed .properties-header {
      flex-direction: column;
      gap: 12px;
    }

    .properties.collapsed .properties-header h3 {
      writing-mode: vertical-rl;
      margin: 5px auto;
      letter-spacing: 2px;
    }

    .properties.collapsed #togglePropertiesButton {
      width: 40px;
      min-width: 40px;
      padding: 5px 2px;
      font-size: 11px;
      writing-mode: vertical-rl;
    }

    /* 左サイドバーの伸縮バー */

    .sidebar-resizer {
      grid-column: 2;
      grid-row: 1;
      position: relative;
      background: var(--bg);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      cursor: col-resize;
      touch-action: none;
      z-index: 20;
      user-select: none;
    }

    .sidebar-resizer::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 2px;
      width: 4px;
      background: #7964a8;
      opacity: 0.55;
      border-radius: 4px;
    }

    .sidebar-resizer:active::after {
      background: var(--accent-light);
      opacity: 1;
    }

    /* 3Dビューポート */

    .viewport {
      grid-column: 3;
      grid-row: 1;
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at center, #282342 0%, #17152b 75%);
    }

    #threeCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .viewport-label {
      position: absolute;
      top: 12px;
      left: 12px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1.5px;
      pointer-events: none;
      opacity: 0.8;
    }

    /* メッシュ編集ツールバー */

    #meshToolbarContainer {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 30;
      max-height: 48%;
      overflow-y: auto;
      pointer-events: none;
      scrollbar-width: thin;
    }

    #meshToolbarContainer .mesh-toolbar {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      pointer-events: auto;
      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    /* 操作履歴 */

    .history-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .history-buttons button {
      margin: 0;
      background: #493b70;
      border-color: #7964a8;
      font-size: 12px;
    }

    /* 複製 */

    #duplicateObject {
      background: #493b70;
      border-color: #7964a8;
    }

    #duplicateObject:hover {
      background: #604b91;
      border-color: var(--accent-light);
    }

    #multiSelectionButton.active {
      background: #604b91;
      border-color: var(--accent-light);
      color: white;
    }

    /* プロパティ入力 */

    .property-name {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      color: white;
      border: 1px solid var(--border);
      border-radius: 7px;
      margin-bottom: 10px;
    }

    .property-row {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
    }

    .property-row label {
      font-size: 12px;
      color: var(--muted);
    }

    .property-row input {
      width: 100%;
      min-width: 0;
      padding: 9px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: white;
    }

    .property-row input[type="color"] {
      height: 38px;
      padding: 3px;
    }

    .property-group {
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }

    .empty {
      color: #aaa0c8;
      font-size: 12px;
      line-height: 1.8;
      padding: 5px 2px;
    }

    /* オブジェクト階層 */

    .hierarchy-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
      min-width: 0;
    }

    .hierarchy-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      width: 100%;
      min-width: 0;
    }

    .hierarchy-row .hierarchy-toggle {
      flex: 0 0 24px;
      width: 24px;
      min-width: 24px;
      padding: 5px 0;
      margin: 0;
      background: transparent;
      border: none;
      color: var(--accent-light);
      font-size: 11px;
    }

    .hierarchy-row .hierarchy-toggle:disabled {
      opacity: 0.25;
    }

    .hierarchy-row .object-item {
      flex: 1 1 0;
      width: 0;
      min-width: 20px;
      max-width: 150px;
      margin: 0;
      padding: 9px 5px;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: var(--panel-light);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: #eee8ff;
      font-size: 12px;
    }

    .hierarchy-row .object-item:hover {
      background: var(--panel-hover);
    }

    .hierarchy-row .object-item.selected {
      background: #604b91;
      border-color: var(--accent-light);
    }

    .hierarchy-row .visibility-container {
      flex: 0 0 38px;
      width: 38px;
      min-width: 38px;
      display: flex;
    }

    .hierarchy-row .lock-container {
      flex: 0 0 34px;
      width: 34px;
      min-width: 34px;
      display: flex;
    }

    .hierarchy-row .visibility-container button {
      width: 38px;
      min-width: 38px;
      height: 38px;
      padding: 3px 1px;
      margin: 0;
      font-size: 11px;
    }

    .hierarchy-row .lock-container button {
      width: 34px;
      min-width: 34px;
      height: 38px;
      padding: 3px 1px;
      margin: 0;
      font-size: 13px;
    }

    /* 親子関係の操作パネル */

    .hierarchy-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
      padding: 12px;
      background: #211b35;
      border: 1px solid var(--border);
      border-radius: 9px;
      width: 100%;
      min-width: 0;
    }

    .hierarchy-controls h3 {
      margin: 0 0 6px;
    }

    .hierarchy-controls label {
      font-size: 12px;
      color: #c9bde8;
    }

    .hierarchy-controls select {
      width: 100%;
      min-width: 0;
      padding: 9px;
      color: #eee8ff;
      background: var(--panel-light);
      border: 1px solid #604b91;
      border-radius: 7px;
    }

    .hierarchy-controls button {
      width: 100%;
      padding: 9px;
      margin: 0;
      color: white;
      background: #493b70;
      border: 1px solid #7964a8;
      border-radius: 7px;
    }

    /* スマートフォン */

    @media (max-width: 750px) {
      header {
        height: 50px;
        padding: 0 10px;
      }

      .logo {
        font-size: 12px;
        letter-spacing: 1px;
      }

      header a {
        font-size: 12px;
        padding: 8px;
      }

      .editor {
        --sidebar-width: 165px;

        grid-template-columns:
          var(--sidebar-width)
          10px
          minmax(0, 1fr);

        grid-template-rows:
          minmax(0, 1fr)
          210px;

        height: calc(100dvh - 50px);
      }

      .sidebar {
        grid-column: 1;
        grid-row: 1;
        padding: 10px 8px;
      }

      .viewport {
        grid-column: 3;
        grid-row: 1;
      }

      .properties {
        grid-column: 1 / 4;
        grid-row: 2;
        border-left: none;
        border-top: 1px solid var(--border);
        padding: 8px 12px;
      }

      .sidebar-resizer {
        grid-column: 2;
        grid-row: 1;
      }

      .properties-header {
        margin-bottom: 6px;
      }

      .properties-header h3 {
        margin: 4px 0;
      }

      .properties.collapsed {
        padding: 5px 10px;
      }

      .properties.collapsed .properties-header {
        flex-direction: row;
        justify-content: space-between;
        gap: 8px;
      }

      .properties.collapsed .properties-header h3 {
        writing-mode: horizontal-tb;
        margin: 5px 0;
        letter-spacing: 0;
      }

      .properties.collapsed #togglePropertiesButton {
        width: auto;
        min-width: 88px;
        min-height: 36px;
        padding: 5px 10px;
        writing-mode: horizontal-tb;
      }

      .editor.properties-collapsed {
        grid-template-rows:
          minmax(0, 1fr)
          48px;
      }

      .properties-inner {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 12px;
      }

      .property-group {
        padding: 6px 0;
      }

      .sidebar h3 {
        font-size: 11px;
        margin: 15px 0 8px;
      }

      .sidebar button {
        min-height: 42px;
        font-size: 11px;
        padding: 8px 4px;
      }

      .history-buttons button {
        font-size: 10px;
      }

      .hierarchy-row {
        gap: 3px;
      }

      .hierarchy-row .object-item {
        font-size: 11px;
        padding: 8px 3px;
      }

      #meshToolbarContainer {
        left: 5px;
        right: 5px;
        bottom: 5px;
        max-height: 55%;
      }

      #meshToolbarContainer .mesh-toolbar {
        padding: 7px;
        gap: 6px;
      }

      #meshToolbarContainer .mesh-toolbar button {
        min-height: 44px;
        padding: 4px 2px;
        font-size: 11px;
      }
    }

    @media (max-width: 380px) {
      .editor {
        --sidebar-width: 145px;
      }

      .sidebar {
        padding-left: 6px;
        padding-right: 6px;
      }

      .hierarchy-row .visibility-container {
        flex-basis: 34px;
        width: 34px;
        min-width: 34px;
      }

      .hierarchy-row .visibility-container button {
        width: 34px;
        min-width: 34px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">INOCHI STUDIO / 3D</div>
  <a href="../index.html">← ホーム</a>
</header>

<main class="editor">

  <!-- 左側ツールパネル -->

  <aside class="sidebar">

    <h3>オブジェクト追加</h3>
    <button id="addCube">＋ キューブ</button>
    <button id="addSphere">＋ 球体</button>
    <button id="addCylinder">＋ 円柱</button>

    <h3>操作履歴</h3>
    <div class="history-buttons">
      <button id="undoButton">↶ Undo</button>
      <button id="redoButton">↷ Redo</button>
    </div>

    <h3>編集ツール</h3>
    <button id="moveTool">移動</button>
    <button id="multiSelectionButton">☐ 複数選択：OFF</button>
    <button id="rotateTool">回転</button>
    <button id="scaleTool">拡大・縮小</button>

    <button id="duplicateObject">📑 複製</button>
    <button id="groupObjects">📦 グループ化</button>
    <button id="ungroupObjects">📂 グループ解除</button>
    <button id="deleteObject">🗑️ 削除</button>

    <h3>オブジェクト一覧</h3>
    <div id="objectList"></div>

    <h3>オブジェクト階層</h3>
    <div id="hierarchyList"></div>

    <div id="hierarchyControls"></div>

  </aside>

  <!-- 左右の幅調整 -->

  <div
    id="sidebarResizer"
    class="sidebar-resizer"
    aria-label="サイドバー幅の調整"
  ></div>

  <!-- 3D画面 -->

  <div class="viewport">
    <div class="viewport-label">3D VIEWPORT</div>

    <canvas id="threeCanvas"></canvas>

    <div id="meshToolbarContainer"></div>
  </div>

  <!-- オブジェクトプロパティ -->

  <aside class="sidebar properties">

    <div class="properties-header">
      <h3>オブジェクトプロパティ</h3>

      <button
        id="togglePropertiesButton"
        type="button"
        aria-expanded="true"
      >
        ▾ 仕舞う
      </button>
    </div>

    <div id="propertyPanel">
      <p class="empty">
        オブジェクトを選択すると、ここで詳細を編集できるよ。
      </p>
    </div>

  </aside>

</main>

<!-- プロパティ欄の開閉 -->

<script>
(() => {
  const editor = document.querySelector(".editor");
  const properties = document.querySelector(".properties");
  const button = document.querySelector("#togglePropertiesButton");

  if (!editor || !properties || !button) return;

  button.addEventListener("click", () => {
    const collapsed = properties.classList.toggle("collapsed");

    editor.classList.toggle("properties-collapsed", collapsed);

    button.textContent = collapsed
      ? "▴ 開く"
      : "▾ 仕舞う";

    button.setAttribute(
      "aria-expanded",
      String(!collapsed)
    );

    window.dispatchEvent(new Event("resize"));
  });
})();
</script>

<!-- 左サイドバーの幅調整 -->

<script>
(() => {
  const editor = document.querySelector(".editor");
  const resizer = document.querySelector("#sidebarResizer");

  if (!editor || !resizer) return;

  let resizing = false;

  function getLimits() {
    const mobile = window.matchMedia("(max-width: 750px)").matches;
    const width = editor.getBoundingClientRect().width;

    return mobile
      ? {
          min: 120,
          max: Math.max(120, Math.min(260, width - 100))
        }
      : {
          min: 180,
          max: Math.max(180, Math.min(360, width - 430))
        };
  }

  resizer.addEventListener("pointerdown", event => {
    resizing = true;
    resizer.setPointerCapture(event.pointerId);
    event.preventDefault();
  });

  resizer.addEventListener("pointermove", event => {
    if (!resizing) return;

    const rect = editor.getBoundingClientRect();
    const limits = getLimits();

    const newWidth = Math.max(
      limits.min,
      Math.min(limits.max, event.clientX - rect.left)
    );

    editor.style.setProperty(
      "--sidebar-width",
      newWidth + "px"
    );

    window.dispatchEvent(new Event("resize"));
  });

  function stopResizing() {
    resizing = false;
  }

  resizer.addEventListener("pointerup", stopResizing);
  resizer.addEventListener("pointercancel", stopResizing);

  window.addEventListener("resize", () => {
    if (resizing) return;

    const limits = getLimits();

    const current = parseFloat(
      getComputedStyle(editor).getPropertyValue("--sidebar-width")
    );

    if (current > limits.max) {
      editor.style.setProperty(
        "--sidebar-width",
        limits.max + "px"
      );
    }
  });
})();
</script>

<!-- エラー表示 -->

<script>
window.addEventListener("error", event => {
  const message = document.createElement("pre");

  message.style.cssText =
    "position:fixed;z-index:9999;top:10px;left:10px;right:10px;padding:12px;background:#500;color:white;white-space:pre-wrap;font-size:12px;";

  message.textContent =
    "JavaScript Error:\n" +
    (event.message || "不明なエラー") +
    "\n" +
    (event.filename || "") +
    ":" +
    (event.lineno || "");

  document.body.appendChild(message);
});

window.addEventListener("unhandledrejection", event => {
  const message = document.createElement("pre");

  message.style.cssText =
    "position:fixed;z-index:9999;top:10px;left:10px;right:10px;padding:12px;background:#500;color:white;white-space:pre-wrap;font-size:12px;";

  message.textContent =
    "Promise Error:\n" + String(event.reason);

  document.body.appendChild(message);
});
</script>

<!-- 3Dエディター本体 -->

<script type="module" src="./main.js?v=9"></script>

</body>
</html>
