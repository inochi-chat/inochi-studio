
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inochi Studio - 3D Editor</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #17152b;
      color: #f8f5ff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    header {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #211d39;
      border-bottom: 1px solid #40375e;
    }

    .logo {
      font-weight: bold;
      letter-spacing: 2px;
    }

    header a {
      color: #c9b5ff;
      text-decoration: none;
      font-size: 13px;
    }

    /* メインレイアウト */
    .editor {
      --sidebar-width: 220px;

      display: grid;
      grid-template-columns:
        var(--sidebar-width)
        10px
        minmax(0, 1fr)
        250px;

      grid-template-rows: minmax(0, 1fr);
      height: calc(100dvh - 55px);
      min-height: 0;
      min-width: 0;
    }

    .sidebar {
      min-width: 0;
      min-height: 0;
      background: #211d39;
      padding: 12px;
      overflow-y: auto;
      overflow-x: hidden;
      border-right: 1px solid #40375e;
    }

    .properties {
      grid-column: 4;
      grid-row: 1;
      border-right: none;
      border-left: 1px solid #40375e;
    }

    h3 {
      font-size: 12px;
      color: #c9b5ff;
      margin: 12px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 6px;
      border: 1px solid #51466f;
      border-radius: 7px;
      background: #30284c;
      color: white;
      cursor: pointer;
    }

    button:active {
      background: #62518d;
    }

    #duplicateObject {
      background: #493b70;
      border-color: #7964a8;
    }

    #duplicateObject:hover {
      background: #604b91;
      border-color: #a48be8;
    }

    .history-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .history-buttons button {
      margin-bottom: 0;
      background: #493b70;
      border-color: #7964a8;
      font-size: 12px;
    }

    .object-item.selected {
      background: #6854a0;
      border-color: #c9b5ff;
    }

    /* 3D画面 */
    .viewport {
      grid-column: 3;
      grid-row: 1;
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    #threeCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .viewport-label {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #aaa0c8;
      font-size: 11px;
      pointer-events: none;
    }

    /* サイドバー伸縮バー */
    .sidebar-resizer {
      grid-column: 2;
      grid-row: 1;
      position: relative;
      background: #17152b;
      border-left: 1px solid #40375e;
      border-right: 1px solid #40375e;
      cursor: col-resize;
      touch-action: none;
      z-index: 20;
      user-select: none;
    }

    .sidebar-resizer::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 2px;
      width: 4px;
      background: #7964a8;
      opacity: 0.55;
      border-radius: 4px;
    }

    .sidebar-resizer:active::after {
      background: #c9b5ff;
      opacity: 1;
    }

    /* プロパティ */
    .property-name {
      width: 100%;
      padding: 9px;
      background: #17152b;
      color: white;
      border: 1px solid #51466f;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .property-row {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
    }

    .property-row label {
      font-size: 12px;
      color: #aaa0c8;
    }

    .property-row input {
      width: 100%;
      min-width: 0;
      padding: 8px 5px;
      border: 1px solid #51466f;
      border-radius: 5px;
      background: #17152b;
      color: white;
    }

    .property-row input[type="color"] {
      height: 36px;
      padding: 3px;
    }

    .property-group {
      padding: 10px 0;
      border-top: 1px solid #40375e;
    }

    .empty {
      color: #9289a9;
      font-size: 12px;
      line-height: 1.8;
    }

    /* オブジェクト一覧 */
    .hierarchy-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
      min-width: 0;
    }

    .hierarchy-item .object-item {
      width: 100%;
      text-align: left;
      background: #29233f;
      border: 1px solid #493b70;
      color: #eee8ff;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
    }

    .hierarchy-item .object-item:hover {
      background: #493b70;
    }

    .hierarchy-item .object-item.selected {
      background: #604b91;
      border-color: #a48be8;
    }

    /* 階層の1行 */
    .hierarchy-row {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      min-width: 0;
    }

    .hierarchy-row .hierarchy-toggle {
      flex: 0 0 24px;
      width: 24px;
      min-width: 24px;
      padding: 6px 0;
      margin: 0;
      background: transparent;
      border: none;
      color: #c9b5ff;
      font-size: 11px;
    }

    .hierarchy-row .hierarchy-toggle:disabled {
      opacity: 0.25;
    }

    .hierarchy-row .object-item {
      flex: 1 1 0;
      width: 0;
      min-width: 20px;
      margin: 0;
      padding: 8px 4px;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hierarchy-row > div {
      flex: 0 0 auto;
      width: auto;
      min-width: 0;
    }

    .hierarchy-row .visibility-button {
      width: 38px;
      min-width: 38px;
      height: 38px;
      padding: 4px 2px;
      margin: 0;
      overflow: hidden;
      white-space: nowrap;
      font-size: 11px;
    }

    .hierarchy-row .lock-button {
      width: 34px;
      min-width: 34px;
      height: 38px;
      padding: 4px 2px;
      margin: 0;
      font-size: 13px;
    }

    /* 親子関係の操作パネル */
    .hierarchy-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
      padding: 12px;
      background: #211b35;
      border: 1px solid #493b70;
      border-radius: 8px;
      width: 100%;
      min-width: 0;
    }

    .hierarchy-controls h3 {
      margin: 0 0 6px;
    }

    .hierarchy-controls label {
      font-size: 12px;
      color: #c9bde8;
    }

    .hierarchy-controls select {
      width: 100%;
      min-width: 0;
      padding: 8px;
      color: #eee8ff;
      background: #29233f;
      border: 1px solid #604b91;
      border-radius: 6px;
    }

    .hierarchy-controls button {
      width: 100%;
      padding: 9px;
      margin-bottom: 0;
      color: white;
      background: #493b70;
      border: 1px solid #7964a8;
      border-radius: 6px;
      cursor: pointer;
    }

    .hierarchy-controls button:hover {
      background: #604b91;
    }

    /* スマホ */
    @media (max-width: 750px) {
      .editor {
        --sidebar-width: 165px;

        grid-template-columns:
          var(--sidebar-width)
          10px
          minmax(0, 1fr);

        grid-template-rows:
          minmax(0, 1fr)
          210px;
      }

      .sidebar {
        grid-column: 1;
        grid-row: 1;
        padding: 10px;
      }

      .viewport {
        grid-column: 3;
        grid-row: 1;
      }

      .properties {
        grid-column: 1 / 4;
        grid-row: 2;
        border-left: none;
        border-top: 1px solid #40375e;
        padding: 8px 12px;
      }

      .sidebar-resizer {
        grid-column: 2;
        grid-row: 1;
      }

      .properties-inner {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 15px;
      }

      .properties h3 {
        margin: 5px 0;
      }

      .property-group {
        padding: 5px 0;
      }

      .logo {
        font-size: 12px;
      }

      .sidebar button {
        font-size: 10px;
        padding: 8px 3px;
      }

      .history-buttons button {
        font-size: 10px;
      }
    }

    
/* 階層ボタンの配置修正 */
.hierarchy-row {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 4px;
  width: 100%;
  min-width: 0;
}

/* オブジェクト名 */

.hierarchy-row .object-item {
  flex: 0 1 auto;
  width: auto;
  min-width: 35px;
  max-width: 110px;
  margin: 0;
  padding: 8px 5px;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 表示ボタンの入れ物 */
.hierarchy-row .visibility-container {
  flex: 0 0 38px;
  width: 38px;
  min-width: 38px;
  display: flex;
  justify-content: flex-start;
}

/* ロックボタンの入れ物 */
.hierarchy-row .lock-container {
  flex: 0 0 34px;
  width: 34px;
  min-width: 34px;
  display: flex;
  justify-content: flex-start;
}

/* 表示ボタン */
.hierarchy-row .visibility-container button {
  width: 38px;
  min-width: 38px;
  height: 38px;
  padding: 3px 1px;
  margin: 0;
  font-size: 11px;
}

/* ロックボタン */
.hierarchy-row .lock-container button {
  width: 34px;
  min-width: 34px;
  height: 38px;
  padding: 3px 1px;
  margin: 0;
}

#multiSelectionButton.active {
  background: #604b91;
  border-color: #c9b5ff;
  color: #ffffff;
}
    
  </style>
</head>

<body>

<header>
  <div class="logo">INOCHI STUDIO / 3D</div>
  <a href="../index.html">← ホーム</a>
</header>

<main class="editor">

  <aside class="sidebar">

    <h3>オブジェクト追加</h3>
    <button id="addCube">＋ キューブ</button>
    <button id="addSphere">＋ 球体</button>
    <button id="addCylinder">＋ 円柱</button>

    <h3>操作履歴</h3>
    <div class="history-buttons">
      <button id="undoButton">↶ Undo</button>
      <button id="redoButton">↷ Redo</button>
    </div>

    <h3>編集ツール</h3>
    <button id="moveTool">移動</button>  
    <button id="multiSelectionButton">☐ 複数選択：OFF</button>
    <button id="rotateTool">回転</button>
    <button id="scaleTool">拡大・縮小</button>
    
    <button id="duplicateObject">📑 複製</button>
    <button id="groupObjects">📦 グループ化</button>
    <button id="ungroupObjects">📂 グループ解除</button>
    <button id="deleteObject">🗑️ 削除</button>


    <h3>オブジェクト一覧</h3>
    <div id="objectList"></div>

    <h3>オブジェクト階層</h3>
    <div id="hierarchyList"></div>

    <div id="hierarchyControls"></div>

  </aside>

  <!-- サイドバー伸縮バー -->
  <div
    id="sidebarResizer"
    class="sidebar-resizer"
    aria-label="サイドバー幅の調整"
  ></div>

  
<div class="viewport">
  <div class="viewport-label">3D VIEWPORT</div>

  <canvas id="threeCanvas"></canvas>

  <div id="meshToolbarContainer"></div>
</div>


  <aside class="sidebar properties">
    <h3>オブジェクトプロパティ</h3>

    <div id="propertyPanel">
      <p class="empty">
        オブジェクトを選択すると、ここで詳細を編集できるよ。
      </p>
    </div>
  </aside>

</main>

<!-- サイドバーの伸縮操作 -->
<script>
(() => {
  const editor = document.querySelector(".editor");
  const resizer = document.querySelector("#sidebarResizer");

  if (!editor || !resizer) return;

  let resizing = false;

  function getLimits() {
    const mobile = window.matchMedia("(max-width: 750px)").matches;
    const width = editor.getBoundingClientRect().width;

    return mobile
      ? {
          min: 120,
          max: Math.max(120, Math.min(260, width - 100))
        }
      : {
          min: 180,
          max: Math.max(180, Math.min(360, width - 430))
        };
  }

  resizer.addEventListener("pointerdown", event => {
    resizing = true;

    resizer.setPointerCapture(event.pointerId);

    event.preventDefault();
  });

  resizer.addEventListener("pointermove", event => {
    if (!resizing) return;

    const rect = editor.getBoundingClientRect();
    const limits = getLimits();

    const newWidth = Math.max(
      limits.min,
      Math.min(limits.max, event.clientX - rect.left)
    );

    editor.style.setProperty(
      "--sidebar-width",
      newWidth + "px"
    );

    window.dispatchEvent(new Event("resize"));
  });

  function stopResizing() {
    resizing = false;
  }

  resizer.addEventListener("pointerup", stopResizing);
  resizer.addEventListener("pointercancel", stopResizing);

  window.addEventListener("resize", () => {
    if (resizing) return;

    const limits = getLimits();
    const current = parseFloat(
      getComputedStyle(editor).getPropertyValue("--sidebar-width")
    );

    if (current > limits.max) {
      editor.style.setProperty(
        "--sidebar-width",
        limits.max + "px"
      );
    }
  });
})();
</script>


<script>
window.addEventListener("error", event => {
  const message = document.createElement("pre");
  message.style.cssText =
    "position:fixed;z-index:9999;top:10px;left:10px;right:10px;padding:12px;background:#500;color:white;white-space:pre-wrap;font-size:12px;";
  message.textContent =
    "JavaScript Error:\n" +
    (event.message || "不明なエラー") +
    "\n" + (event.filename || "") +
    ":" + (event.lineno || "");
  document.body.appendChild(message);
});

window.addEventListener("unhandledrejection", event => {
  const message = document.createElement("pre");
  message.style.cssText =
    "position:fixed;z-index:9999;top:10px;left:10px;right:10px;padding:12px;background:#500;color:white;white-space:pre-wrap;font-size:12px;";
  message.textContent =
    "Promise Error:\n" + String(event.reason);
  document.body.appendChild(message);
});
</script>

  
<script type="module" src="./main.js?v=7"></script>
</body>
</html>
