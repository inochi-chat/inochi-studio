
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inochi Studio - 3D Editor</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #17152b;
      color: #f8f5ff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    header {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #211d39;
      border-bottom: 1px solid #40375e;
    }

    .logo { font-weight: bold; letter-spacing: 2px; }

    header a {
      color: #c9b5ff;
      text-decoration: none;
      font-size: 13px;
    }

    .editor {
      display: grid;
      grid-template-columns: 175px minmax(0, 1fr) 250px;
      height: calc(100dvh - 55px);
    }

    .sidebar {
      background: #211d39;
      padding: 12px;
      overflow-y: auto;
      border-right: 1px solid #40375e;
    }

    .properties {
      border-right: none;
      border-left: 1px solid #40375e;
    }

    h3 {
      font-size: 12px;
      color: #c9b5ff;
      margin: 12px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 6px;
      border: 1px solid #51466f;
      border-radius: 7px;
      background: #30284c;
      color: white;
      cursor: pointer;
    }

    button:active { background: #62518d; }

    .history-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .history-buttons button {
      margin-bottom: 0;
      background: #493b70;
      border-color: #7964a8;
      font-size: 12px;
    }

    .object-item.selected {
      background: #6854a0;
      border-color: #c9b5ff;
    }

    .viewport {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    #threeCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .viewport-label {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #aaa0c8;
      font-size: 11px;
      pointer-events: none;
    }

    .property-name {
      width: 100%;
      padding: 9px;
      background: #17152b;
      color: white;
      border: 1px solid #51466f;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .property-row {
      display: grid;
      grid-template-columns: 22px 1fr;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
    }

    .property-row label {
      font-size: 12px;
      color: #aaa0c8;
    }

    .property-row input {
      width: 100%;
      min-width: 0;
      padding: 8px 5px;
      border: 1px solid #51466f;
      border-radius: 5px;
      background: #17152b;
      color: white;
    }

    .property-row input[type="color"] {
      height: 36px;
      padding: 3px;
    }

    .property-group {
      padding: 10px 0;
      border-top: 1px solid #40375e;
    }

    .empty {
      color: #9289a9;
      font-size: 12px;
      line-height: 1.8;
    }

    @media (max-width: 750px) {
      .editor {
        grid-template-columns: 105px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) 210px;
      }

      .properties {
        grid-column: 1 / 3;
        grid-row: 2;
        border-left: none;
        border-top: 1px solid #40375e;
        padding: 8px 12px;
      }

      .properties-inner {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 15px;
      }

      .properties h3 { margin: 5px 0; }
      .property-group { padding: 5px 0; }
      .logo { font-size: 12px; }
      button { font-size: 10px; padding: 8px 3px; }
      .history-buttons button { font-size: 10px; }
    }
  </style>
</head>

<body>
<header>
  <div class="logo">INOCHI STUDIO / 3D</div>
  <a href="../index.html">← ホーム</a>
</header>

<main class="editor">
  <aside class="sidebar">
    <h3>オブジェクト追加</h3>
    <button id="addCube">＋ キューブ</button>
    <button id="addSphere">＋ 球体</button>
    <button id="addCylinder">＋ 円柱</button>

    <h3>操作履歴</h3>
    <div class="history-buttons">
      <button id="undoButton">↶ Undo</button>
      <button id="redoButton">↷ Redo</button>
    </div>

    <h3>編集ツール</h3>
    <button id="moveTool">移動</button>
    <button id="rotateTool">回転</button>
    <button id="scaleTool">拡大・縮小</button>
    <button id="duplicateObject">📑 複製</button>
    <button id="deleteObject">🗑️ 削除</button>

    <h3>オブジェクト一覧</h3>
    <div id="objectList"></div>
  </aside>

  <section class="viewport">
    <div class="viewport-label">3D VIEWPORT</div>
    <canvas id="threeCanvas"></canvas>
  </section>

  <aside class="sidebar properties">
    <h3>オブジェクトプロパティ</h3>

    <div id="propertyPanel">
      <p class="empty">オブジェクトを選択すると、ここで詳細を編集できるよ。</p>
    </div>
  </aside>
</main>

<script type="module" src="./main.js"></script>
</body>
</html>
