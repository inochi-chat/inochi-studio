
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#17152b">
  <title>Inochi Studio - 3D Editor</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #17152b;
      --panel: #211d39;
      --panel-light: #29233f;
      --panel-hover: #493b70;
      --border: #493f67;
      --accent: #a48be8;
      --accent-light: #c9b5ff;
      --text: #f5f0ff;
      --muted: #aaa0c8;
      --header-height: 52px;
      --sidebar-width: 230px;
      --properties-width: 260px;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      min-height: 40px;
      padding: 9px 10px;
      margin: 0 0 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #30284c;
      color: var(--text);
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover {
      background: var(--panel-hover);
      border-color: var(--accent);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent-light);
      outline-offset: 2px;
    }

    header {
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 100;
    }

    .logo {
      font-weight: 800;
      letter-spacing: 1.3px;
      font-size: 13px;
    }

    header a {
      color: var(--accent-light);
      text-decoration: none;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 7px;
    }

    .editor {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--properties-width);
      grid-template-rows: minmax(0, 1fr);
      width: 100%;
      height: calc(100dvh - var(--header-height));
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      transition: grid-template-columns .2s ease;
    }

    .viewport {
      grid-column: 1;
      grid-row: 1;
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #282342 0%, #17152b 75%);
    }

    #threeCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .viewport-label {
      position: absolute;
      top: 12px;
      left: 12px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1.5px;
      pointer-events: none;
      opacity: .8;
    }

    /* 左パネル */

    .sidebar {
      position: absolute;
      z-index: 50;
      top: 10px;
      bottom: 10px;
      left: 10px;
      width: min(var(--sidebar-width), calc(100vw - 24px));
      padding: 14px 12px;
      overflow-y: auto;
      overflow-x: hidden;
      background: rgba(33, 29, 57, .97);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,.4);
      transform: translateX(calc(-100% - 20px));
      transition: transform .2s ease;
      scrollbar-width: thin;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar h3 {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-light);
      letter-spacing: .5px;
      margin: 17px 0 9px;
    }

    .sidebar h3:first-child {
      margin-top: 3px;
    }

    .sidebar > button {
      width: 100%;
    }

    .history-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .history-buttons button {
      margin: 0;
      background: #493b70;
      border-color: #7964a8;
      font-size: 12px;
    }

    #duplicateObject,
    #multiSelectionButton {
      background: #493b70;
      border-color: #7964a8;
    }

    #multiSelectionButton.active {
      background: #604b91;
      border-color: var(--accent-light);
    }

    /* パネル開閉ボタン */

    .panel-toggle {
      position: absolute;
      z-index: 80;
      top: 12px;
      left: 12px;
      width: 48px;
      height: 48px;
      min-height: 48px;
      padding: 0;
      margin: 0;
      border: 1px solid #7964a8;
      border-radius: 12px;
      background: #30284c;
      color: white;
      font-size: 23px;
      box-shadow: 0 4px 16px rgba(0,0,0,.35);
    }

    .sidebar.open ~ .panel-toggle {
      left: calc(min(var(--sidebar-width), 100vw - 24px) + 22px);
    }

    /* オブジェクトプロパティ */

    .properties {
      grid-column: 2;
      grid-row: 1;
      min-width: 0;
      min-height: 0;
      padding: 12px;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--panel);
      border-left: 1px solid var(--border);
      transition: width .2s ease;
    }

    .properties-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      margin-bottom: 12px;
    }

    .properties-header h3 {
      margin: 4px 0;
      font-size: 12px;
      color: var(--accent-light);
    }

    #togglePropertiesButton {
      flex: 0 0 auto;
      min-width: 75px;
      min-height: 38px;
      padding: 6px 8px;
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      background: #493b70;
      border-color: #7964a8;
    }

    .properties.collapsed {
      padding: 8px 4px;
      overflow: hidden;
    }

    .properties.collapsed #propertyPanel {
      display: none;
    }

    .properties.collapsed .properties-header {
      flex-direction: column;
      gap: 12px;
    }

    .properties.collapsed .properties-header h3 {
      writing-mode: vertical-rl;
      margin: 5px auto;
      letter-spacing: 2px;
    }

    .properties.collapsed #togglePropertiesButton {
      min-width: 38px;
      width: 38px;
      padding: 5px 2px;
      writing-mode: vertical-rl;
    }

    .editor.properties-collapsed {
      grid-template-columns: minmax(0, 1fr) 46px;
    }

    /* プロパティ入力 */

    .property-name {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      color: white;
      border: 1px solid var(--border);
      border-radius: 7px;
      margin-bottom: 10px;
    }

    .property-row {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
    }

    .property-row label {
      font-size: 12px;
      color: var(--muted);
    }

    .property-row input {
      width: 100%;
      min-width: 0;
      padding: 9px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: white;
    }

    .property-row input[type="color"] {
      height: 38px;
      padding: 3px;
    }

    .property-group {
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }

    .empty {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
      padding: 5px 2px;
    }

    /* 階層 */

    .hierarchy-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
      min-width: 0;
    }

    .hierarchy-row {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      min-width: 0;
    }

    .hierarchy-row .hierarchy-toggle {
      flex: 0 0 24px;
      width: 24px;
      min-width: 24px;
      padding: 5px 0;
      margin: 0;
      background: transparent;
      border: none;
      color: var(--accent-light);
      font-size: 11px;
    }

    .hierarchy-row .object-item {
      flex: 1 1 0;
      width: 0;
      min-width: 20px;
      max-width: 150px;
      margin: 0;
      padding: 9px 5px;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: var(--panel-light);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: #eee8ff;
      font-size: 12px;
    }

    .hierarchy-row .object-item.selected {
      background: #604b91;
      border-color: var(--accent-light);
    }

    .hierarchy-row .visibility-container,
    .hierarchy-row .lock-container {
      display: flex;
      flex: 0 0 36px;
      width: 36px;
      min-width: 36px;
    }

    .hierarchy-row .visibility-container button,
    .hierarchy-row .lock-container button {
      width: 36px;
      min-width: 36px;
      height: 38px;
      padding: 3px 1px;
      margin: 0;
      font-size: 12px;
    }

    .hierarchy-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
      padding: 12px;
      background: #211b35;
      border: 1px solid var(--border);
      border-radius: 9px;
      width: 100%;
      min-width: 0;
    }

    .hierarchy-controls h3 {
      margin: 0 0 6px;
    }

    .hierarchy-controls label {
      font-size: 12px;
      color: #c9bde8;
    }

    .hierarchy-controls select {
      width: 100%;
      min-width: 0;
      padding: 9px;
      color: #eee8ff;
      background: var(--panel-light);
      border: 1px solid #604b91;
      border-radius: 7px;
    }

    .hierarchy-controls button {
      width: 100%;
      margin: 0;
      color: white;
      background: #493b70;
      border: 1px solid #7964a8;
    }

    /* メッシュツールバー */

    #meshToolbarContainer {
      position: absolute;
      inset: 0;
      z-index: 60;
      overflow: visible;
      pointer-events: none;
    }

    #meshToolbarContainer > * {
      pointer-events: auto;
    }

    /* 小さな画面 */

    @media (max-width: 750px) {
      :root {
        --header-height: 48px;
        --properties-width: 190px;
      }

      header {
        padding: 0 9px;
      }

      .logo {
        font-size: 11px;
        letter-spacing: .8px;
      }

      header a {
        font-size: 11px;
        padding: 7px;
      }

      .sidebar {
        width: min(220px, calc(100vw - 24px));
        top: 8px;
        bottom: 8px;
        left: 8px;
        padding: 10px 8px;
      }

      .panel-toggle {
        top: 9px;
        left: 9px;
      }

      .properties {
        padding: 8px;
      }

      .properties-header {
        gap: 5px;
        flex-wrap: wrap;
      }

      .properties-header h3 {
        font-size: 11px;
      }

      #togglePropertiesButton {
        min-width: 65px;
        font-size: 10px;
      }

      .property-row {
        grid-template-columns: 19px minmax(0, 1fr);
        gap: 4px;
      }

      .property-row input {
        padding: 8px 3px;
        font-size: 13px;
      }

      .hierarchy-row .object-item {
        font-size: 11px;
        padding: 8px 3px;
      }

      .hierarchy-row .visibility-container,
      .hierarchy-row .lock-container {
        flex-basis: 30px;
        width: 30px;
        min-width: 30px;
      }

      .hierarchy-row .visibility-container button,
      .hierarchy-row .lock-container button {
        width: 30px;
        min-width: 30px;
        font-size: 10px;
      }
    }

    @media (max-width: 520px) {
      :root {
        --properties-width: 150px;
      }

      .properties {
        padding: 7px 5px;
      }

      .properties-header {
        flex-direction: column;
        align-items: stretch;
      }

      .properties-header h3 {
        font-size: 10px;
      }

      #togglePropertiesButton {
        width: 100%;
        min-height: 34px;
      }

      .properties.collapsed .properties-header {
        align-items: center;
      }

      .properties.collapsed #togglePropertiesButton {
        width: 38px;
      }

      .property-row {
        grid-template-columns: 16px minmax(0, 1fr);
        gap: 3px;
      }

      .property-row label {
        font-size: 10px;
      }

      .property-row input {
        font-size: 12px;
      }

      .property-group {
        padding: 7px 0;
      }

      .panel-toggle {
        width: 44px;
        height: 44px;
        min-height: 44px;
      }
    }

    @media (max-width: 360px) {
      :root {
        --properties-width: 128px;
      }

      .properties {
        padding: 6px 4px;
      }
    }

/* 右側プロパティ欄のレイアウト修正 */
.properties {
  position: relative;
  z-index: 2;
  top: auto;
  right: auto;
  bottom: auto;
  left: auto;

  width: auto;
  max-width: none;
  height: 100%;
  min-width: 0;

  transform: none;
  border-radius: 0;
  box-shadow: none;

  overflow-x: hidden;
  overflow-y: auto;
}

/* 収納時も右端に正しく収める */
.properties.collapsed {
  position: relative;
  width: auto;
  min-width: 0;
  transform: none;
}

/* プロパティ欄の中身が横にはみ出さないようにする */
#propertyPanel {
  width: 100%;
  min-width: 0;
  overflow-x: hidden;
}

.properties *,
.properties *::before,
.properties *::after {
  max-width: 100%;
}

  </style>
</head>

<body>

<header>
  <div class="logo">INOCHI STUDIO / 3D</div>
  <a href="../index.html">← ホーム</a>
</header>

<main class="editor">

  <div class="viewport">
    <div class="viewport-label">3D VIEWPORT</div>
    <canvas id="threeCanvas"></canvas>
    <div id="meshToolbarContainer"></div>
  </div>

  <aside class="sidebar" id="leftSidebar">

    <h3>オブジェクト追加</h3>
    <button id="addCube">＋ キューブ</button>
    <button id="addSphere">＋ 球体</button>
    <button id="addCylinder">＋ 円柱</button>

    <h3>操作履歴</h3>
    <div class="history-buttons">
      <button id="undoButton">↶ Undo</button>
      <button id="redoButton">↷ Redo</button>
    </div>

    <h3>編集ツール</h3>
    <button id="moveTool">移動</button>
    <button id="multiSelectionButton">☐ 複数選択：OFF</button>
    <button id="rotateTool">回転</button>
    <button id="scaleTool">拡大・縮小</button>

    <button id="duplicateObject">📑 複製</button>
    <button id="groupObjects">📦 グループ化</button>
    <button id="ungroupObjects">📂 グループ解除</button>
    <button id="deleteObject">🗑️ 削除</button>

    <h3>オブジェクト一覧</h3>
    <div id="objectList"></div>

    <h3>オブジェクト階層</h3>
    <div id="hierarchyList"></div>

    <div id="hierarchyControls"></div>
  </aside>

  <button
    id="toggleSidebarButton"
    class="panel-toggle"
    type="button"
    aria-label="操作パネルを開く"
    aria-expanded="false"
  >☰</button>

  <aside class="sidebar properties" id="propertiesPanel">

    <div class="properties-header">
      <h3>オブジェクトプロパティ</h3>

      <button
        id="togglePropertiesButton"
        type="button"
        aria-expanded="true"
      >▾ 仕舞う</button>
    </div>

    <div id="propertyPanel">
      <p class="empty">
        オブジェクトを選択すると、ここで詳細を編集できるよ。
      </p>
    </div>

  </aside>

</main>

<script>
(() => {
  const sidebar = document.querySelector("#leftSidebar");
  const button = document.querySelector("#toggleSidebarButton");

  if (!sidebar || !button) return;

  button.addEventListener("click", () => {
    const opened = sidebar.classList.toggle("open");

    button.textContent = opened ? "×" : "☰";
    button.setAttribute("aria-expanded", String(opened));
    button.setAttribute(
      "aria-label",
      opened ? "操作パネルを閉じる" : "操作パネルを開く"
    );
  });

  document.addEventListener("pointerdown", event => {
    if (
      sidebar.classList.contains("open") &&
      !sidebar.contains(event.target) &&
      !button.contains(event.target)
    ) {
      sidebar.classList.remove("open");
      button.textContent = "☰";
      button.setAttribute("aria-expanded", "false");
      button.setAttribute("aria-label", "操作パネルを開く");
    }
  });
})();
</script>

<script>
(() => {
  const editor = document.querySelector(".editor");
  const properties = document.querySelector("#propertiesPanel");
  const button = document.querySelector("#togglePropertiesButton");

  if (!editor || !properties || !button) return;

  button.addEventListener("click", () => {
    const collapsed = properties.classList.toggle("collapsed");

    editor.classList.toggle("properties-collapsed", collapsed);

    button.textContent = collapsed ? "▴ 開く" : "▾ 仕舞う";
    button.setAttribute("aria-expanded", String(!collapsed));

    window.dispatchEvent(new Event("resize"));
  });
})();
</script>

<script>
window.addEventListener("error", event => {
  const message = document.createElement("pre");

  message.style.cssText =
    "position:fixed;z-index:99999;top:10px;left:10px;right:10px;padding:12px;background:#500;color:white;white-space:pre-wrap;font-size:12px;";

  message.textContent =
    "JavaScript Error:\n" +
    (event.message || "不明なエラー") +
    "\n" +
    (event.filename || "") +
    ":" +
    (event.lineno || "");

  document.body.appendChild(message);
});

window.addEventListener("unhandledrejection", event => {
  const message = document.createElement("pre");

  message.style.cssText =
    "position:fixed;z-index:99999;top:10px;left:10px;right:10px;padding:12px;background:#500;color:white;white-space:pre-wrap;font-size:12px;";

  message.textContent =
    "Promise Error:\n" + String(event.reason);

  document.body.appendChild(message);
});
</script>

<script type="module" src="./main.js?v=15"></script>

</body>
</html>
